<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แปลภาษา</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #1a1f2e; --muted: #6b7280;
    --border: #dde2ec; --accent: #2563eb; --accent-text: #ffffff; --soft: #eef3ff;
    --error: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1420; --card: #1a2030; --text: #e8ecf4; --muted: #9aa3b5;
      --border: #2c3447; --accent: #5b8cff; --accent-text: #0f1420; --soft: #222b40;
      --error: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", "Noto Sans", sans-serif;
    font-size: 17px; line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.5rem; margin: 4px 0 16px; }
  .langs { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  select {
    flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
  }
  button {
    font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); padding: 10px 14px;
  }
  button:disabled { opacity: .5; cursor: default; }
  .swap { flex: none; width: 48px; font-size: 1.2rem; padding: 10px 0; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px; margin-bottom: 12px;
  }
  textarea {
    width: 100%; min-height: 130px; resize: vertical; border: none; outline: none;
    background: transparent; color: var(--text); font: inherit; font-size: 1.15rem;
  }
  .out { min-height: 130px; font-size: 1.15rem; white-space: pre-wrap; word-break: break-word; }
  .out.placeholder { color: var(--muted); }
  .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 8px; }
  .primary {
    width: 100%; background: var(--accent); color: var(--accent-text); border: none;
    font-weight: 600; padding: 14px; margin-bottom: 12px; font-size: 1.05rem;
  }
  .status { color: var(--muted); font-size: .9rem; min-height: 1.4em; margin: 0 4px 8px; }
  .status.error { color: var(--error); }
  .count { color: var(--muted); font-size: .85rem; margin-right: auto; align-self: center; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--soft); padding: 4px; border-radius: 14px; margin-bottom: 14px; }
  .tab { border: none; background: transparent; font-weight: 600; padding: 10px; }
  .tab.active { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); color: var(--accent); }
  [hidden] { display: none !important; }
  .log-head { display: flex; justify-content: space-between; align-items: center; margin: 6px 4px 8px; color: var(--muted); font-size: .95rem; }
  .log-head button { padding: 6px 12px; font-size: .9rem; }
  .settings { display: flex; align-items: center; gap: 10px; margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--muted); font-size: .95rem; }
  .settings select { flex: none; width: auto; padding: 6px 10px; }
  .hint { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .convo-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .convo-controls select { grid-column: 1 / -1; }
  .big { font-weight: 600; padding: 16px 10px; }
  .listening { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .opt { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .95rem; margin: 4px 4px 0; }
  .opt input { width: 20px; height: 20px; }
  .live { min-height: 1.5em; color: var(--muted); font-style: italic; margin: 4px 4px 10px; }
  .log { display: flex; flex-direction: column; gap: 8px; }
  .entry { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; }
  .entry.me { background: var(--soft); }
  .entry .who { font-size: .8rem; color: var(--muted); }
  .entry .orig { color: var(--muted); }
  .entry .tr { font-size: 1.2rem; }
  .showbig {
    position: fixed; inset: 0; background: var(--card); color: var(--text); display: none;
    flex-direction: column; justify-content: center; align-items: center; padding: 24px 16px;
    text-align: center; font-size: 2rem; line-height: 1.4; z-index: 10; word-break: break-word;
  }
  .showbig.open { display: flex; }
  .showbig small { font-size: 1rem; color: var(--muted); margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>แปลภาษา</h1>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="convo">🎧 สนทนา</button>
    <button class="tab" role="tab" data-tab="typed">⌨️ พิมพ์แปล</button>
  </div>

  <section id="panel-convo">
  <p class="hint">วางมือถือให้ใกล้คู่สนทนา ใส่หูฟังบลูทูธ แล้วกด "เริ่มฟัง" แอพจะฟังต่อเนื่อง แปลเป็นไทย และอ่านออกเสียงเข้าหูฟังให้อัตโนมัติ</p>
  <div class="convo-controls">
    <select id="otherLang" aria-label="ภาษาคู่สนทนา"></select>
    <button class="big" id="listenBtn">▶ เริ่มฟัง</button>
    <button class="big" id="meBtn">🎤 ฉันพูด (ไทย)</button>
  </div>
  <label class="opt"><input type="checkbox" id="earbuds" checked> ใส่หูฟังอยู่ (ฟังต่อได้ระหว่างอ่านคำแปล)</label>
  <div class="live" id="live"></div>
  <div class="log-head" id="logHead" hidden>
    <span>ประวัติสนทนา</span>
    <button id="clearLog">🗑 ลบประวัติ</button>
  </div>
  <div class="log" id="log"></div>
  </section>

  <section id="panel-typed" hidden>
  <div class="langs">
    <select id="from" aria-label="ภาษาต้นทาง"></select>
    <button class="swap" id="swap" title="สลับภาษา" aria-label="สลับภาษา">⇄</button>
    <select id="to" aria-label="ภาษาปลายทาง"></select>
  </div>

  <div class="card">
    <textarea id="input" placeholder="พิมพ์ข้อความที่นี่..." maxlength="2000"></textarea>
    <div class="row">
      <span class="count" id="count">0 / 2000</span>
      <button id="clear">ล้าง</button>
      <button id="speakIn" title="ฟังเสียงข้อความต้นฉบับ">🔊 ฟัง</button>
    </div>
  </div>

  <button class="primary" id="go">แปล</button>
  <div class="status" id="status"></div>

  <div class="card">
    <div class="out placeholder" id="output">คำแปลจะแสดงที่นี่</div>
    <div class="row">
      <button id="copy" disabled>📋 คัดลอก</button>
      <button id="speakOut" disabled title="ฟังเสียงคำแปล">🔊 ฟังคำแปล</button>
    </div>
  </div>

  </section>

  <div class="settings">
    <label for="rate">ความเร็วเสียงอ่าน</label>
    <select id="rate">
      <option value="0.75">ช้า</option>
      <option value="1">ปกติ</option>
      <option value="1.25">เร็ว</option>
      <option value="1.5">เร็วมาก</option>
    </select>
  </div>
</main>
<div class="showbig" id="showbig" role="dialog"><div id="showbigText"></div><small>แตะเพื่อปิด</small></div>

<script>
const LANGS = {
  th: { name: "ไทย", google: "th", mm: "th-TH", voice: "th-TH" },
  en: { name: "อังกฤษ", google: "en", mm: "en-GB", voice: "en-US" },
  zh: { name: "จีน", google: "zh-CN", mm: "zh-CN", voice: "zh-CN" },
  ja: { name: "ญี่ปุ่น", google: "ja", mm: "ja-JP", voice: "ja-JP" },
};

const $ = (id) => document.getElementById(id);
const fromSel = $("from"), toSel = $("to"), input = $("input"), output = $("output");
let lastResult = "";

function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

for (const [code, l] of Object.entries(LANGS)) {
  fromSel.add(new Option(l.name, code));
  toSel.add(new Option(l.name, code));
}
fromSel.value = LANGS[load("from")] ? load("from") : "th";
toSel.value = LANGS[load("to")] ? load("to") : "en";

// Only Thai <-> other pairs: if neither side is Thai, set the other side to Thai.
function fixPair(changed) {
  const other = changed === fromSel ? toSel : fromSel;
  if (changed.value === other.value || (changed.value !== "th" && other.value !== "th")) {
    other.value = changed.value === "th" ? "en" : "th";
  }
  store("from", fromSel.value); store("to", toSel.value);
}
fromSel.onchange = () => { fixPair(fromSel); translate(); };
toSel.onchange = () => { fixPair(toSel); translate(); };

$("swap").onclick = () => {
  [fromSel.value, toSel.value] = [toSel.value, fromSel.value];
  store("from", fromSel.value); store("to", toSel.value);
  if (lastResult) { input.value = lastResult; updateCount(); }
  translate();
};

function setStatus(msg, isError) {
  $("status").textContent = msg || "";
  $("status").classList.toggle("error", !!isError);
}
function showOutput(text) {
  lastResult = text;
  output.textContent = text || "คำแปลจะแสดงที่นี่";
  output.classList.toggle("placeholder", !text);
  $("copy").disabled = $("speakOut").disabled = !text;
}

async function viaGoogle(text, from, to) {
  const url = "https://translate.googleapis.com/translate_a/single?client=gtx&dt=t"
    + "&sl=" + LANGS[from].google + "&tl=" + LANGS[to].google + "&q=" + encodeURIComponent(text);
  const res = await fetch(url);
  if (!res.ok) throw new Error("google " + res.status);
  const data = await res.json();
  return data[0].map((part) => part[0]).join("");
}
async function viaMyMemory(text, from, to) {
  const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text)
    + "&langpair=" + LANGS[from].mm + "|" + LANGS[to].mm;
  const res = await fetch(url);
  const data = await res.json();
  if (data.responseStatus != 200) throw new Error("mymemory " + data.responseStatus);
  return data.responseData.translatedText;
}

async function translateText(text, from, to) {
  try { return await viaGoogle(text, from, to); }
  catch (e) { return await viaMyMemory(text, from, to); }
}

let requestId = 0;
async function translate() {
  const text = input.value.trim();
  if (!text) { showOutput(""); setStatus(""); return; }
  const id = ++requestId;
  const from = fromSel.value, to = toSel.value;
  setStatus("กำลังแปล...");
  $("go").disabled = true;
  try {
    const result = await translateText(text, from, to);
    if (id !== requestId) return;
    showOutput(result);
    setStatus("");
  } catch (e) {
    if (id !== requestId) return;
    setStatus("แปลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง", true);
  } finally {
    if (id === requestId) $("go").disabled = false;
  }
}

// Text to speech.
// 1st choice: Google's free voice as an audio file (works the same on every phone, no voice install needed).
// Fallback: the voices built into the device/browser.
const player = new Audio();
const rateSel = $("rate");
rateSel.value = ["0.75", "1", "1.25", "1.5"].includes(load("rate")) ? load("rate") : "1";
rateSel.onchange = () => store("rate", rateSel.value);
const speechRate = () => parseFloat(rateSel.value) || 1;
let speakToken = 0;
let stopCurrent = null;

function splitText(text, max) {
  const parts = [];
  let rest = text.replace(/\s+/g, " ").trim();
  while (rest.length > max) {
    let cut = -1;
    for (const ch of ["。", "．", ".", "！", "!", "？", "?", "，", ",", "、", " "]) {
      cut = Math.max(cut, rest.lastIndexOf(ch, max - 1));
    }
    if (cut < max / 3) cut = max - 1;
    parts.push(rest.slice(0, cut + 1).trim());
    rest = rest.slice(cut + 1).trim();
  }
  if (rest) parts.push(rest);
  return parts;
}

function speakWithGoogle(text, lang, token) {
  return new Promise((resolve, reject) => {
    const parts = splitText(text, 180);
    let i = 0, started = false;
    stopCurrent = resolve;
    const next = () => {
      if (token !== speakToken) return resolve();
      if (i >= parts.length) { setStatus(""); return resolve(); }
      player.src = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob"
        + "&tl=" + LANGS[lang].google + "&q=" + encodeURIComponent(parts[i++]);
      player.playbackRate = speechRate();
      player.play().then(() => { started = true; }).catch((e) => { if (!started) reject(e); });
    };
    player.onended = next;
    player.onerror = () => { if (!started) reject(new Error("audio")); else next(); };
    next();
  });
}

function speakWithDevice(text, lang) {
  return new Promise((resolve) => {
    if (!("speechSynthesis" in window)) { setStatus("เครื่องนี้อ่านออกเสียงไม่ได้", true); return resolve(); }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const tag = LANGS[lang].voice;
    u.lang = tag;
    const voices = speechSynthesis.getVoices();
    const voice = voices.find((v) => v.lang.replace("_", "-") === tag)
      || voices.find((v) => v.lang.toLowerCase().startsWith(lang));
    if (voice) u.voice = voice;
    u.rate = 0.95 * speechRate();
    u.onstart = () => setStatus("");
    u.onend = () => resolve();
    u.onerror = () => {
      setStatus("เครื่องนี้อาจไม่มีเสียงภาษา" + LANGS[lang].name + " ลองติดตั้งเสียงในการตั้งค่าเครื่อง", true);
      resolve();
    };
    // Android Chrome sometimes drops speech that starts right after cancel(), so wait a moment.
    setTimeout(() => speechSynthesis.speak(u), 100);
    // Safety net: never wait forever.
    setTimeout(resolve, 4000 + text.length * 250);
  });
}

async function speak(text, lang, quiet) {
  if (!text) { setStatus("พิมพ์ข้อความก่อน แล้วกดฟังอีกครั้ง", true); return; }
  const token = ++speakToken;
  if (stopCurrent) { stopCurrent(); stopCurrent = null; }
  player.pause();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (!quiet) setStatus("กำลังเล่นเสียง... (ถ้าไม่ได้ยิน ตรวจว่าเครื่องไม่ได้ปิดเสียงอยู่)");
  try {
    await speakWithGoogle(text, lang, token);
  } catch (e) {
    if (token === speakToken) await speakWithDevice(text, lang);
  }
}
if ("speechSynthesis" in window) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

$("speakIn").onclick = () => speak(input.value.trim(), fromSel.value);
$("speakOut").onclick = () => speak(lastResult, toSel.value);
$("go").onclick = translate;
$("clear").onclick = () => { input.value = ""; updateCount(); showOutput(""); setStatus(""); input.focus(); };
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(lastResult); setStatus("คัดลอกแล้ว"); }
  catch (e) { setStatus("คัดลอกไม่สำเร็จ", true); }
};

function updateCount() { $("count").textContent = input.value.length + " / 2000"; }
let typingTimer;
input.addEventListener("input", () => {
  updateCount();
  clearTimeout(typingTimer);
  typingTimer = setTimeout(translate, 700); // translate automatically after typing stops
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); translate(); }
});

// ---------- Conversation mode ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const REC_LANG = { th: "th-TH", en: "en-US", zh: "zh-CN", ja: "ja-JP" };
const otherSel = $("otherLang"), listenBtn = $("listenBtn"), meBtn = $("meBtn"), live = $("live");
for (const code of ["en", "zh", "ja"]) otherSel.add(new Option("คู่สนทนาพูดภาษา" + LANGS[code].name, code));
otherSel.value = ["en", "zh", "ja"].includes(load("other")) ? load("other") : "en";
otherSel.onchange = () => { store("other", otherSel.value); if (autoOn) restartRec(); };

let autoOn = false;      // continuous listening to the other person
let meMode = false;      // currently recording my Thai speech
let busy = false;        // translating/speaking the queue
let rec = null;
const queue = [];
const earbudsBox = $("earbuds");
earbudsBox.checked = load("earbuds") !== "0";
earbudsBox.onchange = () => store("earbuds", earbudsBox.checked ? "1" : "0");
// With earbuds the mic can't hear the translation, so keep listening while it plays.
const keepListening = () => earbudsBox.checked;

// Per listening session: collect finished pieces and wait for a pause before translating,
// so a long sentence is translated as one piece instead of word by word.
let sess = null;
function newSession(lang, isMe) { return { lang, isMe, combined: "", sent: 0, timer: null }; }

function flush(s) {
  if (!s) return;
  clearTimeout(s.timer);
  const text = s.combined.slice(s.sent).trim();
  s.sent = s.combined.length;
  if (!text) return;
  queue.push({ text, lang: s.lang, isMe: s.isMe });
  setLive(autoOn ? "กำลังฟังคู่สนทนา..." : "");
  if (s.isMe) { meMode = false; updateButtons(); if (sess === s) restartRec(); }
  processQueue();
}

function setLive(t) { live.textContent = t || ""; }

function addEntry(isMe, orig, tr) {
  const div = document.createElement("div");
  div.className = "entry" + (isMe ? " me" : "");
  const who = document.createElement("div"); who.className = "who";
  who.textContent = isMe ? "ฉัน" : "คู่สนทนา";
  const o = document.createElement("div"); o.className = "orig"; o.textContent = orig;
  const t = document.createElement("div"); t.className = "tr"; t.textContent = tr;
  div.append(who, o, t);
  div.onclick = () => speak(tr, isMe ? otherSel.value : "th", true);
  $("log").prepend(div);
  $("logHead").hidden = false;
}

function showBig(text) { $("showbigText").textContent = text; $("showbig").classList.add("open"); }
$("showbig").onclick = () => $("showbig").classList.remove("open");

function stopRec() {
  if (rec) { rec.onend = null; rec.onresult = null; rec.onerror = null; try { rec.abort(); } catch (e) {} rec = null; }
  if (sess) { flush(sess); sess = null; }
}

const micPaused = () => busy && !keepListening();

function startRec() {
  stopRec();
  if (micPaused() || (!autoOn && !meMode)) return;
  const r = new SR();
  const lang = meMode ? "th" : otherSel.value;
  const s = newSession(lang, meMode);
  sess = s;
  r.lang = REC_LANG[lang];
  r.continuous = true;
  r.interimResults = true;
  r.onresult = (e) => {
    const finals = [];
    let interim = "";
    for (let i = 0; i < e.results.length; i++) {
      const t = e.results[i][0].transcript.trim();
      if (!t) continue;
      if (e.results[i].isFinal) {
        // Some Android phones repeat earlier words in each result; keep only the longest version.
        const last = finals[finals.length - 1];
        if (last && t.startsWith(last)) finals[finals.length - 1] = t;
        else if (!(last && last.startsWith(t))) finals.push(t);
      } else interim += " " + t;
    }
    s.combined = finals.join(" ");
    if (s.sent > s.combined.length) s.sent = s.combined.length;
    const pending = (s.combined.slice(s.sent) + interim).trim();
    setLive(pending ? "กำลังฟัง: " + pending : "");
    clearTimeout(s.timer);
    if (s.combined.length - s.sent > 300) flush(s);
    else s.timer = setTimeout(() => flush(s), s.isMe ? 1200 : 1600);
  };
  r.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      autoOn = false; meMode = false; updateButtons();
      setLive("แอพยังไม่ได้รับอนุญาตให้ใช้ไมค์ กดอนุญาตไมค์ในเบราว์เซอร์ แล้วลองใหม่");
    }
  };
  r.onend = () => {
    if (rec === r) rec = null;
    if (sess === s) { flush(s); sess = null; }
    // Phones stop listening after a pause; start again automatically.
    if (!rec && !micPaused() && (autoOn || meMode)) setTimeout(() => { if (!rec) startRec(); }, 250);
  };
  rec = r;
  try { r.start(); setLive(meMode ? "พูดภาษาไทยได้เลย..." : "กำลังฟังคู่สนทนา..."); }
  catch (e) { rec = null; }
}
function restartRec() { stopRec(); startRec(); }

async function processQueue() {
  if (busy) return;
  busy = true;
  if (!keepListening()) stopRec();
  while (queue.length) {
    const item = queue.shift();
    const to = item.isMe ? otherSel.value : "th";
    try {
      const tr = await translateText(item.text, item.lang, to);
      addEntry(item.isMe, item.text, tr);
      if (item.isMe) showBig(tr);
      await speak(tr, to, true);
    } catch (e) {
      setLive("แปลไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต");
      await new Promise((r) => setTimeout(r, 1500));
    }
  }
  busy = false;
  if (!rec) startRec();
}

function updateButtons() {
  listenBtn.textContent = autoOn ? "⏸ หยุดฟัง" : "▶ เริ่มฟัง";
  listenBtn.classList.toggle("listening", autoOn);
  meBtn.classList.toggle("listening", meMode);
  meBtn.textContent = meMode ? "🎤 กำลังฟังคุณ..." : "🎤 ฉันพูด (ไทย)";
}

if (!SR) {
  listenBtn.disabled = meBtn.disabled = true;
  setLive("เบราว์เซอร์นี้ฟังเสียงไม่ได้ กรุณาเปิดด้วย Google Chrome");
}
listenBtn.onclick = () => {
  autoOn = !autoOn; meMode = false;
  updateButtons();
  if (autoOn) startRec(); else { stopRec(); setLive(""); }
};
meBtn.onclick = () => {
  meMode = !meMode;
  updateButtons();
  if (micPaused()) return;
  restartRec();
  if (!meMode && !autoOn) setLive("");
};

// ---------- Tabs ----------
function showTab(name) {
  document.querySelectorAll(".tab").forEach((t) => {
    const on = t.dataset.tab === name;
    t.classList.toggle("active", on);
    t.setAttribute("aria-selected", on);
  });
  $("panel-convo").hidden = name !== "convo";
  $("panel-typed").hidden = name !== "typed";
  store("tab", name);
}
document.querySelectorAll(".tab").forEach((t) => (t.onclick = () => showTab(t.dataset.tab)));
showTab(load("tab") === "typed" ? "typed" : "convo");

$("clearLog").onclick = () => {
  if (!confirm("ลบประวัติสนทนาทั้งหมด?")) return;
  $("log").innerHTML = "";
  $("logHead").hidden = true;
};
</script>
